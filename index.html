<style>
/*
VOICE: a storybook quest at dusk: brave and friendly, never babyish.
IDEA: a night-sky map. The page is the sky; problems are bright trail cards laid on it.
PICTURE: Pip the fox and the guardians carry the personality; a strip of realm scenery sits on each problem card.
COLOUR and TYPE: indigo sky, royal violet for actions, sun gold for rewards, ember for streaks.
  Grandstander for headings and buttons, Atkinson Hyperlegible wherever digits have to be read.
LAYOUT: quest board on top; problem left and answer right on wide screens; one column on iPad portrait and phones.
The game keeps one look (the night sky) in both light and dark mode, by choice.
*/
:root {
  color-scheme: light;
  --sky-1: #131836;
  --sky-2: #1f2757;
  --sky-3: #2c3780;
  --sky-ink: #f1f3ff;
  --sky-muted: #b9c1ee;
  --bg: #eef0fb;
  --hud-bg: rgba(255, 255, 255, 0.95);
  --card: #ffffff;
  --card-2: #eef0fa;
  --ink: #171b36;
  --ink-2: #3a4168;
  --muted: #5d6589;
  --line: #dadff1;
  --line-strong: #b9c1e2;
  --primary: #4a54e6;
  --primary-deep: #2e36ad;
  --primary-ink: #ffffff;
  --primary-soft: #e7e9ff;
  --flame: #ff6a2b;
  --gold: #ffbd2e;
  --gold-deep: #b97c00;
  --gold-ink: #2b1d00;
  --good: #0c7f55;
  --good-soft: #def4e9;
  --retry: #b8430f;
  --retry-soft: #ffeede;
  --boss: #c2255c;
  --boss-deep: #8f1442;
  --boss-soft: #ffe4ee;
  --pip: #f47b2a;
  --pip-deep: #a04a0e;
  --pip-soft: #fff1e2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s-good: #0ca30c;
  --t-concept: rgba(42, 120, 214, 0.14); --t-careless: rgba(235, 104, 52, 0.15); --t-misread: rgba(27, 175, 122, 0.16); --t-rushed: rgba(237, 161, 0, 0.2); --t-clean: rgba(12, 163, 12, 0.14);
  --shadow: 0 1px 0 rgba(8, 10, 30, 0.08), 0 14px 34px -16px rgba(8, 10, 30, 0.55);
  --radius: 20px;
  --font: "Atkinson Hyperlegible", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Grandstander", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; font: 17px/1.5 var(--font); overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.12; letter-spacing: -0.01em; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kicker { display: inline-block; font-size: 14px; font-weight: 800; color: var(--primary); }
.app { max-width: 1240px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) clamp(10px, 3vw, 28px) max(40px, env(safe-area-inset-bottom)); }
.loading { padding: 60px; text-align: center; font-weight: 700; }

/* ---------- controls ---------- */
.btn {
  appearance: none; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink);
  font: inherit; font-weight: 800; border-radius: 14px; min-height: 48px; padding: 10px 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  transition: transform 0.08s, box-shadow 0.15s, background 0.15s; touch-action: manipulation; text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 0 var(--primary-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--primary-deep); transform: translateY(3px); }
.btn.boss { background: var(--boss); border-color: var(--boss); color: #fff; box-shadow: 0 4px 0 var(--boss-deep); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--retry); color: var(--retry); }
.btn.big { min-height: 58px; font-size: 19px; padding: 12px 24px; }
.btn.huge { min-height: 76px; font-size: 28px; width: 100%; border-radius: 20px; margin-top: 8px; }
.btn.small { min-height: 42px; font-size: 15px; padding: 6px 14px; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; box-shadow: none; transform: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.icon-btn { width: 48px; height: 48px; flex: none; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
.field { display: grid; gap: 6px; margin: 14px 0; font-weight: 700; align-content: start; }
.field input, .field select, .filters select, .filters input, .pin-change input, .backup-tab textarea, .manual-copy textarea {
  border: 2px solid var(--line-strong); border-radius: 12px; padding: 10px 12px; min-height: 48px; background: var(--card); font-size: 17px; width: 100%;
}
.field small { font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 48px; min-width: 64px; padding: 6px 16px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--card); font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; }
.seg button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.chip.skill { background: var(--primary-soft); border-color: transparent; color: var(--ink); }
.chip.contest { background: rgba(255, 183, 3, 0.18); border-color: transparent; }
.chip.rematch { background: var(--boss-soft); border-color: transparent; color: var(--ink); }
.chip.boss { background: var(--boss-soft); }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.tchip::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: currentColor; }
.tchip.t-clean { background: var(--t-clean); } .tchip.t-clean::before { background: var(--s-good); }
.tchip.t-concept { background: var(--t-concept); } .tchip.t-concept::before { background: var(--s1); }
.tchip.t-careless { background: var(--t-careless); } .tchip.t-careless::before { background: var(--s2); }
.tchip.t-misread { background: var(--t-misread); } .tchip.t-misread::before { background: var(--s3); }
.tchip.t-rushed { background: var(--t-rushed); } .tchip.t-rushed::before { background: var(--s4); }

/* ---------- cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(16px, 2.4vw, 26px); }
.card-title { font-size: 16px; color: var(--muted); margin-bottom: 10px; }

/* ---------- start ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 24px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.start-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.hero h1 { font-size: clamp(36px, 5.2vw, 54px); line-height: 1.05; margin: 6px 0 14px; text-wrap: balance; }
.how { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 6px; font-size: 18px; color: var(--ink-2); }
.how li { padding-left: 26px; position: relative; }
.how li::before { content: ""; position: absolute; left: 4px; top: 0.55em; width: 10px; height: 10px; border-radius: 3px; background: var(--gold); transform: rotate(45deg); }
.side { display: grid; gap: 14px; }
.countdown { display: flex; gap: 16px; align-items: center; padding: 16px 18px; }
.cd-days { width: 92px; height: 92px; flex: none; border-radius: 18px; background: var(--primary); color: var(--primary-ink); display: grid; place-content: center; text-align: center; box-shadow: inset 0 -6px 0 var(--primary-deep); }
.cd-days b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.cd-days span { font-size: 14px; font-weight: 700; }
.countdown:nth-child(2) .cd-days { background: var(--flame); color: #fff; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.18); }
.cd-text { display: grid; gap: 2px; }
.cd-text h3 { font-size: 21px; }
.cd-date { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-weight: 700; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; align-content: start; }
.stat span { font-size: 14px; color: var(--muted); font-weight: 700; }
.stat b { font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.boss-waiting { grid-column: 1 / -1; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--boss); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 12px; height: 12px; border-radius: 4px; background: var(--line-strong); }
.pips i.on { background: var(--gold); }

/* ---------- scoreboard ---------- */
.hud {
  position: sticky; top: 6px; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 8px 10px; margin: 0 0 12px; background: var(--hud-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
}
.hud-cell { display: flex; align-items: center; gap: 6px; padding: 4px 12px; min-height: 46px; border-radius: 12px; background: var(--card-2); font-variant-numeric: tabular-nums; }
.hud-cell b { font-size: 23px; }
.hud-cell span { font-size: 14px; color: var(--muted); font-weight: 700; }
.hud-cell.level span { color: var(--ink-2); }
.hud-cell.level { gap: 8px; }
.timer { color: var(--ink); }
.timer.low b { color: var(--retry); animation: pulse 1s ease-in-out infinite; }
.timer.boss-time { background: var(--boss-soft); }
.streak.hot { background: rgba(255, 90, 31, 0.14); }
.tally { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 300px; }
.tally .tchip { min-height: 32px; }
.hud-actions { margin-left: auto; display: flex; gap: 8px; }
.flame.lit path:first-child { animation: flicker 1.4s ease-in-out infinite; }
.banner { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -2px 0 12px; padding: 10px 14px; border-radius: 14px; background: var(--boss); color: #fff; font-weight: 800; animation: pulse 1.6s ease-in-out infinite; }

/* ---------- arena ---------- */
.arena { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.meta .count { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 14px; }
.question { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.45; font-weight: 650; white-space: pre-line; margin: 12px 0 14px; }
.fig { color: var(--ink); max-width: 420px; margin: 4px auto 14px; }
.fig.small { max-width: 260px; margin: 6px 0; }
.fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.fig svg line, .fig svg polygon, .fig svg rect { stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig svg polygon { fill: var(--primary-soft); }
.fig svg rect.ghost { stroke-dasharray: 6 6; stroke-width: 2; opacity: 0.5; }
.fig svg rect.tile { fill: var(--primary-soft); }
.fig svg rect.hole { fill: rgba(255, 183, 3, 0.28); stroke-dasharray: 5 5; }
.fig svg .stick { stroke: #c0843a; stroke-width: 6; }
.fig svg .lbl { fill: currentColor; stroke: none; font: 800 15px var(--font); }
.fig svg .lbl.small { font-size: 13px; font-weight: 700; }
.fig svg .dot { fill: var(--primary); stroke: none; }
.fig svg .hl line { stroke: var(--boss); stroke-width: 5; }
.fig svg .hl-text { fill: var(--boss); }
.fig svg circle, .fig svg path, .fig svg polyline, .fig svg ellipse { stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig svg text { fill: currentColor; stroke: none; font: 700 15px var(--font); }
.fig svg .f1 { fill: var(--primary-soft); }
.fig svg .f2 { fill: rgba(255, 183, 3, 0.38); }
.fig svg .f3 { fill: rgba(230, 73, 128, 0.32); }
.fig svg .f4 { fill: rgba(120, 120, 140, 0.30); }
.fig svg .solid { fill: currentColor; }
.fig svg .nofill { fill: none; }
.fig svg .thin { stroke-width: 1.5; }
.fig svg .grid { stroke-width: 1; opacity: 0.45; }
.fig svg .dash { stroke-dasharray: 6 5; }
.fig svg .nostroke { stroke: none; }
.hints { list-style: none; margin: 6px 0 10px; padding: 0; display: grid; gap: 8px; }
.hint { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 183, 3, 0.14); border: 1px solid rgba(255, 183, 3, 0.45); animation: pop 0.25s ease-out; }
.hint-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--ink-2); }
.chat { display: grid; gap: 8px; margin: 8px 0; }
.bubble { display: grid; gap: 2px; padding: 9px 12px; border-radius: 14px; max-width: 92%; font-size: 16px; }
.bubble b { font-size: 13px; color: var(--muted); }
.bubble.coach { background: var(--primary-soft); justify-self: start; border-bottom-left-radius: 4px; }
.bubble.kid { background: var(--card-2); justify-self: end; border-bottom-right-radius: 4px; }
.bubble.thinking span { color: var(--muted); }
.ask { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 6px 6px 12px; border: 2px dashed var(--line-strong); border-radius: 14px; color: var(--muted); }
.ask input { flex: 1; border: 0; background: transparent; min-height: 40px; font-size: 16px; outline: none; }

.choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 14px; border-radius: 16px;
  border: 2px solid var(--line-strong); background: var(--card); color: var(--ink); font: inherit; font-size: 20px; font-weight: 700;
  text-align: left; cursor: pointer; position: relative; touch-action: manipulation;
}
.choice .letter { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); font-weight: 900; flex: none; }
.choice.picked { border-color: var(--primary); background: var(--primary-soft); }
.choice.picked .letter { background: var(--primary); color: var(--primary-ink); }
.choice.struck { opacity: 0.45; }
.choice.struck .ctext { text-decoration: line-through; }
.choice .struck-x { margin-left: auto; color: var(--retry); }
.choice:disabled { cursor: default; }

.answer-box { display: flex; align-items: center; gap: 8px; border: 3px solid var(--line-strong); border-radius: 18px; padding: 6px 14px; background: var(--card); min-height: 74px; }
.answer-box:focus-within { border-color: var(--primary); }
.answer-box.locked { opacity: 0.7; }
.answer-box input { flex: 1; width: 100%; border: 0; background: transparent; font: 800 36px/1.1 var(--font); outline: none; font-variant-numeric: tabular-nums; padding: 4px 0; }
.answer-box input::placeholder { color: var(--line-strong); }
.answer-box .pre, .answer-box .unit { font-size: 19px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.answer-box .pre { font-size: 30px; }
.numpad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.key { min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--card-2); color: var(--ink); font: 800 25px var(--font); cursor: pointer; touch-action: manipulation; }
.key:active { transform: translateY(1px); background: var(--primary-soft); }
.key.k-0 { grid-column: span 2; }
.key.k-space, .key.k-clear { font-size: 15px; }
.key.k-del { font-size: 22px; }
.key:disabled { opacity: 0.45; }

.why { margin-top: 16px; display: grid; gap: 6px; }
.why label { font-size: 16px; color: var(--ink-2); }
.why label b { color: var(--ink); font-size: 18px; }
.why textarea { width: 100%; border: 2px solid var(--line-strong); border-radius: 14px; padding: 10px 12px; font-size: 17px; line-height: 1.45; background: var(--card); resize: vertical; min-height: 88px; }
.why textarea:focus { border-color: var(--primary); outline: none; }
.why.ok textarea { border-color: var(--good); }
.why-meter { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 700; }
.why-meter .dots { display: inline-flex; gap: 4px; }
.why-meter .dots i { width: 16px; height: 7px; border-radius: 4px; background: var(--line-strong); }
.why-meter .dots i.on { background: var(--good); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.actions .btn.big:last-child { flex: 1 1 180px; }
.gate { margin: 8px 0 0; font-size: 15px; color: var(--muted); font-weight: 700; }
.gate.ready { color: var(--good); }

/* ---------- feedback ---------- */
.fb { margin-top: 14px; padding: 16px; border-radius: 18px; border: 2px solid; display: grid; gap: 6px; animation: pop 0.3s ease-out; }
.fb h3 { font-size: 23px; }
.fb-head { display: flex; align-items: center; gap: 10px; }
.fb-icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.fb.good { background: var(--good-soft); border-color: var(--good); }
.fb.good .fb-icon { background: var(--good); }
.fb.retry { background: var(--retry-soft); border-color: var(--retry); }
.fb.retry .fb-icon { background: var(--retry); }
.fb.rematch { background: var(--boss-soft); border-color: var(--boss); }
.fb.rematch .fb-icon { background: var(--boss); }
.fb.victory { background: linear-gradient(135deg, var(--good-soft), rgba(255, 183, 3, 0.22)); }
.fb-points { font-weight: 800; font-size: 18px; }
.fb-streak { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--flame); }
.fb-check { font-size: 18px; }
.fb-rushed { font-weight: 700; }
.fb .btn { margin-top: 6px; justify-self: start; }

/* ---------- boss ---------- */
.boss-card { border-color: var(--boss); box-shadow: 0 0 0 3px var(--boss-soft), var(--shadow); }
.boss-head { display: flex; gap: 14px; align-items: center; }
.boss-info { display: grid; gap: 4px; }
.boss-info h2 { font-size: clamp(24px, 3vw, 32px); }
.boss-kicker { font-weight: 800; font-size: 14px; color: var(--boss); }
.hpbar { display: flex; gap: 6px; }
.hpbar i { width: 64px; height: 16px; border-radius: 6px; background: var(--boss); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2); transition: background 0.4s, transform 0.4s; }
.hpbar i.gone { background: var(--line); box-shadow: none; transform: scaleY(0.6); }
.boss-story { white-space: pre-line; }
.small-story { margin: 12px 0 8px; font-size: 17px; color: var(--ink-2); }
.hit-box { margin: 8px 0 12px; padding: 12px 14px; border-radius: 16px; background: var(--boss-soft); }
.hit-label { font-weight: 900; color: var(--boss); font-size: 15px; }
.hit-box .question { margin: 4px 0 0; }
.monster { overflow: visible; flex: none; animation: bob 2.6s ease-in-out infinite; }
.monster.enter { animation: enter 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both, bob 2.6s 0.7s ease-in-out infinite; }
.monster.hit { animation: hit 0.55s ease-out; }
.monster.block { animation: smug 0.7s ease-in-out; }
.monster.defeated { animation: none; transform: rotate(-14deg) scale(0.85); opacity: 0.55; filter: grayscale(0.7); }
.monster.escaped { animation: none; opacity: 0.7; transform: translateX(12px) rotate(4deg); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 14, 26, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.overlay-card { background: var(--card); color: var(--ink); border-radius: 26px; padding: clamp(20px, 4vw, 34px); max-width: 560px; width: 100%; display: grid; gap: 12px; justify-items: center; text-align: center; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5); max-height: calc(100vh - 32px); overflow: auto; }
.boss-intro .overlay-card { border: 3px solid var(--boss); }
.boss-intro h2 { font-size: clamp(28px, 4vw, 38px); }
.boss-intro .boss-story { font-size: 18px; text-align: left; background: var(--boss-soft); padding: 12px 14px; border-radius: 14px; }
.flash { background: rgba(10, 14, 26, 0.35); pointer-events: none; }
.flash-card { text-align: center; color: #fff; animation: zoom 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45); }
.flash-card h2 { font-size: clamp(48px, 10vw, 96px); font-weight: 900; color: var(--gold); line-height: 1; }
.flash-card .kicker { color: #fff; font-size: 20px; }
.flash-card p { font-size: 20px; font-weight: 700; }
.toast { position: fixed; z-index: 55; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 16px; box-shadow: var(--shadow); animation: pop 0.3s ease-out; max-width: calc(100% - 24px); }
.confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; width: 100%; height: 100%; }
.paused h2 { font-size: 40px; }
.pinpad { display: grid; gap: 10px; justify-items: center; width: 100%; }
.pinpad h2 { font-size: 26px; }
.pin-dots { display: flex; gap: 14px; margin: 6px 0; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line-strong); }
.pin-dots i.on { background: var(--primary); border-color: var(--primary); }
.pin-dots.shake { animation: hit 0.4s; }
.pin-error { color: var(--retry); font-weight: 700; min-height: 1.4em; margin: 0; }
.pin-keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
.pin-keys button { height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card-2); color: var(--ink); font: 800 26px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.pin-keys button.ghost { background: transparent; font-size: 16px; }
.manual-copy { width: 100%; margin-top: 8px; display: grid; gap: 6px; text-align: left; }
.manual-copy textarea { font-size: 14px; }

/* ---------- end + report ---------- */
.end { display: grid; gap: 16px; }
.result { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.result.won { background: linear-gradient(135deg, var(--card), rgba(255, 183, 3, 0.16)); }
.result-text { flex: 1 1 320px; display: grid; gap: 8px; }
.result-text h1 { font-size: clamp(32px, 4.6vw, 48px); text-wrap: balance; }
.result-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.result-stats > div { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 14px; background: var(--card-2); }
.result-stats b { font-size: 24px; font-variant-numeric: tabular-nums; }
.result-stats span { color: var(--muted); font-weight: 700; font-size: 14px; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.report { display: grid; gap: 12px; }
.report-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: start; }
.report-head h2 { font-size: 24px; margin-top: 2px; }
.report-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.report-stats div { background: var(--card-2); border-radius: 14px; padding: 10px 12px; }
.report-stats dt { font-size: 14px; color: var(--muted); font-weight: 700; }
.report-stats dd { margin: 0; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.report-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; }
.practice { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--primary-soft); }
.report-items { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: ri; }
.report-items > .ri > .ri-head::before { counter-increment: ri; content: counter(ri) "."; font-weight: 900; font-size: 17px; margin-right: 2px; }
.ri { display: grid; gap: 6px; }
.ri-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ri-q { font-weight: 650; margin: 0; white-space: pre-line; }
.ri-attempts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ri-attempts li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 8px 10px; border-radius: 12px; background: var(--card-2); }
.ri-mark { font-weight: 900; }
.ri-mark.ok { color: var(--good); }
.ri-mark.no { color: var(--retry); }
.ri-ans { font-weight: 800; }
.ri-why { flex: 1 1 100%; color: var(--ink-2); font-style: italic; }
.boss-steps { padding-top: 8px; border-top: 1px dashed var(--line-strong); }
.crash { max-width: 520px; margin: 60px auto; display: grid; gap: 12px; text-align: center; justify-items: center; }

/* ---------- parent corner ---------- */
.parent { place-items: stretch; padding: max(10px, env(safe-area-inset-top)) 10px 10px; }
.parent-sheet { background: var(--bg); border-radius: 24px; width: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; max-height: calc(100vh - 20px); overflow: hidden; border: 1px solid var(--line); }
.parent-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.parent-head h2 { font-size: 22px; }
.parent-head .icon-btn { margin-left: auto; }
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tabs button { min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px solid transparent; background: transparent; font: inherit; font-weight: 800; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--primary-soft); color: var(--ink); border-color: var(--primary); }
.parent-body { overflow: auto; padding: 16px; display: grid; gap: 16px; align-content: start; }
.parent-gate .overlay-card { max-width: 380px; }
.empty { text-align: center; padding: 40px 10px; }
.section-title { font-size: 19px; margin: 6px 0; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.chart { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.chart figcaption { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.legend { display: inline-flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--ink-2); font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.s1 { background: var(--s1); } .s2 { background: var(--s2); } .s3 { background: var(--s3); } .s4 { background: var(--s4); }
.vbars { display: flex; align-items: stretch; gap: 8px; height: 170px; border-bottom: 1px solid var(--line-strong); padding-top: 18px; }
.vbar { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; outline: none; }
.vbar-track { flex: 1; width: 100%; max-width: 36px; display: flex; align-items: flex-end; }
.vbar-fill { width: 100%; border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
.vbar:hover .vbar-fill, .vbar:focus .vbar-fill, .vbar:hover .stack-col, .vbar:focus .stack-col { filter: brightness(1.12); outline: 2px solid var(--ink); outline-offset: 1px; }
.vbar-label { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.vbar-x { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; margin-bottom: -22px; }
.vbars { margin-bottom: 24px; }
.stack-col { width: 100%; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.seg-fill { flex-basis: 0; min-height: 3px; }
.skill-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.skill-table th { text-align: left; font-size: 13px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-strong); }
.skill-table td { padding: 8px; border-bottom: 1px solid var(--line); }
.skill-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.meter { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: var(--line); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.session-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.session-row { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-height: 52px; }
.session-row.open { border-color: var(--primary); }
.sr-date { font-weight: 800; }
.sr-tags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.set-block { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 8px; }
.set-block h3 { font-size: 18px; }
.set-block.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.set-block > .btn { justify-self: start; }
.brand span { white-space: nowrap; }
.set-block.two .field { margin: 0; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.toggle.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.switch { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; }
.switch input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
.pin-change { display: flex; flex-wrap: wrap; gap: 8px; }
.pin-change input { width: 120px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input { width: auto; flex: 1 1 160px; }
.key-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.key-entry { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.key-entry.in-rematch { border-color: var(--boss); }
.key-row { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; background: transparent; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.key-id { font-weight: 800; color: var(--muted); font-size: 14px; }
.key-q { flex: 1 1 100%; font-size: 15px; }
.key-ans { font-weight: 900; color: var(--good); }
.key-detail { padding: 0 12px 12px; display: grid; gap: 8px; }
.key-choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
.key-choices li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--card-2); }
.key-choices li.correct { background: var(--good-soft); }
.key-hints { margin: 0; padding-left: 20px; font-size: 15px; display: grid; gap: 2px; }
.boss-key { padding: 12px 14px; display: grid; gap: 6px; }
.boss-key h4 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.boss-key ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }

/* ---------- motion ---------- */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.05, 0.97) rotate(-2deg); } }
@keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes zoom { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes enter { from { transform: translateY(40px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hit { 0% { transform: translateX(0); } 20% { transform: translateX(-12px) rotate(-7deg); filter: brightness(1.9); } 45% { transform: translateX(9px) rotate(5deg); } 70% { transform: translateX(-4px); } 100% { transform: none; } }
@keyframes smug { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 60% { transform: rotate(4deg); } }

/* ---------- narrow screens ---------- */
@media (max-width: 980px) {
  .arena { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 560px) {
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices .choice:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .start-grid { grid-template-columns: minmax(0, 1fr); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  body { font-size: 16px; }
  .hud { position: relative; top: 0; border-radius: 14px; }
  .hud-cell { padding: 4px 8px; }
  .hud-cell b { font-size: 20px; }
  .tally { order: 9; flex-basis: 100%; }
  .report-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .set-block.two { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .boss-head .monster { width: 90px; height: 90px; }
  .hpbar i { width: 46px; }
  .pin-keys { grid-template-columns: repeat(3, 68px); }
  .cd-days { width: 78px; height: 78px; }
  .cd-days b { font-size: 32px; }
  .hide-sm { display: none; }
  .brand { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ============ the quest look, layered on the base styles ============ */

/* ---------- the night sky ---------- */
html { background: var(--sky-1); }
body { background: transparent; } /* the html element paints the sky colour, so the star layer below can show */
/* the sky sits on its own fixed layer, so it stays put while the page scrolls (also on iPad) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 30px 40px, rgba(255, 255, 255, 0.85) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 150px 110px, rgba(255, 255, 255, 0.7) 50%, transparent 52%),
    radial-gradient(1.8px 1.8px at 240px 30px, rgba(255, 233, 170, 0.9) 50%, transparent 52%),
    radial-gradient(1.1px 1.1px at 90px 200px, rgba(255, 255, 255, 0.6) 50%, transparent 52%),
    radial-gradient(900px 520px at 88% -10%, rgba(110, 124, 255, 0.34), transparent 66%),
    linear-gradient(180deg, var(--sky-1), var(--sky-2) 72%, var(--sky-3));
  background-size: 280px 260px, 280px 260px, 280px 260px, 280px 260px, auto, auto;
  background-repeat: repeat, repeat, repeat, repeat, no-repeat, no-repeat;
}
h1, h2, h3, h4, .btn, .brand, .seg button, .tabs button, .toggle, .choice .letter, .kicker, .card-title { font-family: var(--display); }
h1, h2, h3, h4 { letter-spacing: 0; }
.kicker { color: var(--primary); }
.loading { color: var(--sky-ink); }
.brand { color: #fff; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.topbar :focus-visible, .hero :focus-visible, .camp-bar :focus-visible, .end-actions :focus-visible, .trail-picker :focus-visible { outline-color: var(--gold); }
.btn.on-sky, .camp-bar .btn.ghost { color: var(--sky-ink); border-color: rgba(255, 255, 255, 0.38); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 var(--gold-deep); }
.btn.gold:active { box-shadow: 0 1px 0 var(--gold-deep); transform: translateY(3px); }
.chip.new { background: var(--good-soft); border-color: transparent; color: var(--good); }
.stars { display: inline-flex; gap: 2px; color: var(--line-strong); vertical-align: middle; }
.stars svg.on { color: var(--gold); }

/* ---------- start screen ---------- */
.start-grid { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.hero { display: grid; gap: 18px; align-content: start; color: var(--sky-ink); }
.hero-head { display: flex; gap: 16px; align-items: center; }
.hero-head .pip { flex: none; }
.hero .kicker { color: var(--gold); }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.04; color: #fff; margin: 4px 0 8px; text-wrap: balance; }
.hero-line { font-size: 19px; color: var(--sky-muted); max-width: 48ch; margin: 0; }
.paths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 6px; }
.path-card {
  position: relative; display: grid; gap: 8px; align-content: start; text-align: left; padding: 24px 20px 18px; min-height: 196px;
  border-radius: 22px; border: 2px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: var(--sky-ink);
  font: inherit; cursor: pointer; touch-action: manipulation; transition: transform 0.08s;
}
.path-card b { font: 800 29px/1.1 var(--display); color: #fff; }
.path-card > span { color: var(--sky-muted); font-size: 16.5px; line-height: 1.4; }
.path-card .path-go { margin-top: auto; padding-top: 6px; display: inline-flex; align-items: center; gap: 6px; font: 800 18px var(--display); color: #fff; }
.path-card:active { transform: translateY(2px); }
.path-card.pick { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); box-shadow: 0 6px 0 var(--gold-deep); }
.path-card.pick b, .path-card.pick .path-go { color: var(--gold-ink); }
.path-card.pick > span { color: #55400a; }
.path-card > .path-flag, .path-card.pick > .path-flag { position: absolute; top: -13px; left: 16px; background: var(--ink); color: #fff; font: 800 13px var(--display); padding: 4px 11px; border-radius: 999px; }
.hero-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; color: var(--ink); }
.hero-fields .field { margin: 0; }
.hero-fields > p { grid-column: 1 / -1; margin: 0; }
.relic-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.realm-card h3, .relic-card h3 { font-size: 19px; }
.realm-path { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; position: relative; }
.realm-path::before { content: ""; position: absolute; left: 10%; right: 10%; top: 16px; height: 4px; border-radius: 2px; background: var(--line); }
.realm-path li { display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; position: relative; }
.realm-path .node { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); border: 3px solid var(--line-strong); font: 800 16px var(--display); color: var(--muted); }
.realm-path .past .node { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
.realm-path .here .node { background: var(--gold); border-color: var(--gold-deep); color: var(--gold-ink); box-shadow: 0 0 0 5px rgba(255, 189, 46, 0.28); }
.realm-path .rname { font-size: 11.5px; line-height: 1.15; color: var(--muted); font-weight: 700; }
.realm-path .here .rname { color: var(--ink); }
.rank-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0; color: var(--gold-deep); }
.rank-line b { color: var(--ink); font-family: var(--display); }
.rank-line span { color: var(--muted); font-size: 14px; }
.relic-card { background: linear-gradient(160deg, #2a3476, #1a2150); border-color: rgba(255, 255, 255, 0.14); color: var(--sky-ink); }
.relic-card h3 { color: #fff; }
.relic-card .muted { color: var(--sky-muted); }
.relic-hall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px 6px; }
.relic-hall li { display: grid; justify-items: center; align-content: start; gap: 3px; text-align: center; font-size: 11.5px; line-height: 1.15; font-weight: 700; color: var(--sky-muted); }
.relic-hall li.got { color: #fff; }
.relic.got { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35)); }

/* ---------- quest board ---------- */
.hud-cell.points svg, .hud-cell.wisdom svg { color: var(--gold-deep); }
.realm-strip { position: relative; height: 64px; margin: calc(-1 * clamp(16px, 2.4vw, 26px)) calc(-1 * clamp(16px, 2.4vw, 26px)) 12px; border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0; overflow: hidden; }
.realm-strip .scene { width: 100%; height: 100%; display: block; }
.realm-name { position: absolute; left: 12px; bottom: 8px; background: rgba(19, 24, 54, 0.8); color: #fff; font: 800 13px var(--display); padding: 3px 11px; border-radius: 999px; }
.fb-relic { display: flex; align-items: center; gap: 10px; font-size: 18px; margin: 2px 0; }

/* ---------- clues: the guide asks first ---------- */
.gate-card { margin: 10px 0; padding: 14px; border-radius: 18px; background: var(--pip-soft); border: 2px solid var(--pip); display: grid; gap: 10px; animation: pop 0.25s ease-out; }
.gate-head { display: flex; gap: 12px; align-items: center; }
.gate-head .pip { flex: none; }
.gate-kicker { font: 800 13.5px var(--display); color: var(--pip-deep); }
.gate-q { margin: 2px 0 0; font-size: 19px; font-weight: 700; line-height: 1.35; }
.gate-options { display: grid; gap: 8px; }
.gate-opt {
  min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink);
  font: inherit; font-size: 18px; font-weight: 700; text-align: left; cursor: pointer; touch-action: manipulation;
}
.gate-opt:not(:disabled):hover { border-color: var(--pip); }
.gate-opt:disabled { cursor: default; opacity: 0.75; }
.gate-opt.struck { opacity: 0.42; text-decoration: line-through; }
.gate-opt.right { border-color: var(--good); background: var(--good-soft); opacity: 1; }
.gate-note { margin: 0; font-weight: 700; font-size: 15.5px; color: var(--retry); }
.gate-note.muted { color: var(--muted); }
.hint-label .wise { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font: 800 12px var(--display); }
.hint-qa { font-size: 15.5px; color: var(--ink-2); }
.hint-qa b { color: var(--ink); }
.hint-text i { font-style: normal; font-weight: 700; color: var(--ink-2); }

/* ---------- asking out loud ---------- */
.mic-wrap { position: relative; display: inline-flex; flex: none; }
.icon-btn.mic { width: 44px; height: 44px; border-radius: 12px; }
.icon-btn.mic.on { background: var(--boss); border-color: var(--boss); color: #fff; animation: pulse 1.1s ease-in-out infinite; }
.mic-live { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 5; width: max-content; max-width: min(320px, 72vw); background: var(--ink); color: #fff; font-size: 14.5px; line-height: 1.35; padding: 7px 11px; border-radius: 10px; }
.why-row { display: flex; gap: 8px; align-items: flex-start; }
.why-row textarea { flex: 1; }

/* ---------- sketch pad ---------- */
.pad { margin: 10px 0; }
.pad.closed { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pad-tip { font-size: 15.5px; color: var(--ink-2); font-weight: 700; }
.pad-tip.muted { color: var(--muted); font-weight: 400; }
.pad.open { border: 2px solid var(--line-strong); border-radius: 16px; overflow: hidden; background: var(--card); }
.pad-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 10px; background: var(--card-2); }
.pad-head b { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); }
.pad-head .pad-hide { margin-left: auto; min-height: 36px; }
.pad-stage { position: relative; height: 250px; background-color: #fdfdff; background-image: radial-gradient(circle, #c5cbe6 1.1px, transparent 1.4px); background-size: 22px 22px; }
.pad.big .pad-stage { height: 440px; }
.pad-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.pad-stage canvas.erasing { cursor: cell; }
.pad-under { position: absolute; left: 10px; top: 10px; width: min(46%, 250px); margin: 0; opacity: 0.45; pointer-events: none; }
.pad-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.ink { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--card); background: var(--ink-color); box-shadow: 0 0 0 2px var(--line-strong); cursor: pointer; padding: 0; }
.ink.on { box-shadow: 0 0 0 3px var(--ink); }
.tool { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 4px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: 700 14.5px var(--font); cursor: pointer; }
.tool.on { background: var(--primary-soft); border-color: var(--primary); }
.tool:disabled { opacity: 0.45; cursor: default; }

/* ---------- training camp ---------- */
.camp-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; color: var(--sky-ink); }
.camp-title { display: grid; line-height: 1.15; margin-right: auto; }
.camp-title b { font: 800 22px var(--display); color: #fff; }
.camp-title span { color: var(--sky-muted); font-size: 15px; }
.camp-hero { display: flex; gap: 18px; align-items: center; }
.camp-hero .pip { flex: none; }
.camp-hero h1 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 6px; }
.camp-hero p { max-width: 62ch; }
.trail-picker { display: grid; gap: 20px; }
.trail-picker h2 { color: #fff; font-size: 20px; margin-bottom: 10px; }
.trail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.trail-tile { display: grid; gap: 6px; align-content: start; text-align: left; padding: 16px; border-radius: 18px; border: 2px solid transparent; background: var(--card); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--shadow); touch-action: manipulation; }
.trail-tile:hover { border-color: var(--primary); }
.trail-tile.featured { border-color: var(--gold); background: linear-gradient(135deg, #fff, #fff4d6); max-width: 540px; }
.trail-skill { font: 800 13px var(--display); color: var(--primary); }
.trail-name { font: 800 20px/1.15 var(--display); }
.trail-blurb { color: var(--ink-2); font-size: 15.5px; line-height: 1.4; }
.trail-state { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.trail-go { display: inline-flex; align-items: center; gap: 4px; font: 800 15px var(--display); color: var(--primary-deep); }
.big-stars { margin: 0; }
.lesson-card { display: grid; gap: 16px; max-width: 880px; margin: 0 auto; }
.lesson-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lesson-dots { display: inline-flex; gap: 6px; }
.lesson-dots i { width: 26px; height: 8px; border-radius: 4px; background: var(--line-strong); }
.lesson-dots i.done { background: var(--good); }
.lesson-dots i.now { background: var(--gold); }
.lesson-say { display: flex; gap: 14px; align-items: flex-start; }
.lesson-say .pip { flex: none; }
.speech { position: relative; flex: 1; background: var(--pip-soft); border: 2px solid var(--pip); border-radius: 18px; padding: 12px 16px; font-size: clamp(18px, 2.2vw, 21px); line-height: 1.45; }
.speech p { margin: 0; white-space: pre-line; }
.speech::before { content: ""; position: absolute; left: -10px; top: 26px; width: 16px; height: 16px; background: var(--pip-soft); border-left: 2px solid var(--pip); border-bottom: 2px solid var(--pip); transform: rotate(45deg); }
.lesson-pic { display: grid; justify-items: center; padding: 4px 0; }
.lesson-ask { display: grid; gap: 10px; }
.lesson-q { margin: 0; font-size: clamp(19px, 2.3vw, 23px); font-weight: 700; line-height: 1.4; }
.lesson-ask .gate-options { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.lesson-num { display: flex; gap: 10px; align-items: center; }
.lesson-num input { width: 150px; min-height: 56px; border: 3px solid var(--line-strong); border-radius: 14px; padding: 6px 14px; font: 700 28px var(--font); background: var(--card); }
.lesson-num input:focus { border-color: var(--primary); outline: none; }
.lesson-why { margin: 0; display: block; }
.lesson-nav { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.sol { margin: 4px 0; padding-left: 24px; display: grid; gap: 6px; font-size: 17px; }
.fb.teach { background: var(--pip-soft); border-color: var(--pip); }
.fb.teach .fb-icon { background: var(--pip); }

/* ---------- lesson pictures ---------- */
.pic { max-width: 100%; }
svg.pic { width: min(100%, 440px); height: auto; display: block; overflow: visible; }
svg.pic-dots { width: min(100%, 420px); }
.pic .cell { fill: #fff; stroke: var(--ink-2); stroke-width: 2; }
.pic .cell.on { fill: var(--gold); }
.pic-label { font: 700 15px var(--font); fill: var(--ink); }
.pic-text { font: 700 14px var(--font); fill: var(--ink); }
.pic .group { fill: var(--card-2); stroke: var(--line-strong); stroke-width: 2; }
.pic .group.on { fill: #fff0c2; stroke: var(--gold-deep); }
.pic .dot { fill: var(--primary); }
.pic .dot.gone { fill: var(--line-strong); }
.pic .dot-x { stroke: var(--retry); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.pic .seg { stroke: var(--ink-2); stroke-width: 2; }
.pic .seg.s0 { fill: #dfe3ff; }
.pic .seg.s1 { fill: #ffe7a8; }
.pic .seg.s2 { fill: #c9f0dd; }
.pic .axis, .pic .tick { stroke: var(--ink-2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.pic .jump { stroke: var(--pip); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.pic .jump-label { fill: var(--pip-deep); }
.pic .shape { fill: var(--primary-soft); stroke: var(--ink); stroke-width: 3; }
.pic .gridline { stroke: var(--primary); stroke-width: 1; opacity: 0.55; }
.pic-steps { list-style: none; margin: 0; padding: 12px 18px; display: grid; gap: 6px; width: fit-content; background: var(--card-2); border-radius: 14px; font: 700 21px var(--font); }
.pic-steps mark { background: var(--gold); border-radius: 6px; padding: 0 4px; }
.pic-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pic-list li { padding: 6px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line-strong); font-weight: 700; }
.pic-table { border-collapse: collapse; font-size: 17px; }
.pic-table th, .pic-table td { border: 2px solid var(--line-strong); padding: 6px 14px; text-align: center; }
.pic-table th { background: var(--card-2); }

/* ---------- parent corner extras ---------- */
.key-block { border-top: 1px dashed var(--line-strong); padding-top: 10px; margin-top: 4px; display: grid; gap: 6px; }
.key-block h4 { font-size: 16px; }
.pin-change input[type="password"] { width: min(100%, 320px); }

/* ---------- narrow screens ---------- */
@media (max-width: 640px) {
  .paths { grid-template-columns: minmax(0, 1fr); }
  .path-card { min-height: 0; }
  .hero-fields { grid-template-columns: minmax(0, 1fr); }
  .hero-head .pip { width: 66px; height: 66px; }
  .realm-strip { height: 50px; }
  .lesson-say .pip { width: 54px; height: 54px; }
  .camp-hero { align-items: flex-start; }
  .camp-hero .pip { width: 60px; height: 60px; }
  .pad-stage { height: 220px; }
}

/* ---------- roads: two warm-up roads and the main quest ---------- */
.road-pick { display: grid; gap: 8px; }
.road-pick h2 { margin: 0; font-size: 24px; color: #fff; }
.road-help { margin: 0; color: var(--sky-muted); font-size: 16px; max-width: 56ch; }
.roads { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 12px; margin-top: 6px; }
.road-card {
  position: relative; display: grid; gap: 3px; align-content: start; text-align: left; cursor: pointer;
  padding: 14px 14px 12px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.07); color: var(--sky-ink);
  font: inherit; min-height: 132px;
}
.road-card b { font: 800 19px/1.15 var(--display); color: #fff; }
.road-card .road-tag { display: inline-flex; align-items: center; gap: 4px; font: 800 12.5px var(--display); color: var(--sky-muted); }
.road-card .road-grade { font-weight: 700; font-size: 14px; color: #fff; }
.road-card .road-line { font-size: 14px; line-height: 1.35; color: var(--sky-muted); }
.road-card.road-2 { border-color: rgba(143, 209, 106, 0.55); }
.road-card.road-3 { border-color: rgba(94, 173, 98, 0.6); }
.road-card.main { border-color: rgba(255, 189, 46, 0.7); background: rgba(255, 189, 46, 0.1); }
.road-card.main .road-tag { color: var(--gold); }
.road-card.on { background: #fff; border-color: #fff; color: var(--ink); box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25); }
.road-card.on b { color: var(--ink); }
.road-card.on .road-grade { color: var(--ink); }
.road-card.on .road-line, .road-card.on .road-tag { color: var(--ink-2); }
.road-card.main.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 5px 0 var(--gold-deep); }
.road-card.main.on .road-line, .road-card.main.on .road-tag { color: #55400a; }
.road-card:active { transform: translateY(2px); }
.road-card .road-here { position: absolute; top: -11px; right: 12px; background: var(--ink); color: #fff; font: 800 12px var(--display); padding: 3px 10px; border-radius: 999px; }
.road-card .road-flag { margin-top: 4px; justify-self: start; background: var(--pip, #ff8a3d); color: #fff; font: 800 12px var(--display); padding: 3px 10px; border-radius: 999px; }
.side-note { margin: -4px 4px 0; color: var(--sky-muted); }
.step-up { display: flex; gap: 14px; align-items: center; }
.step-up h2 { margin: 0 0 4px; font-size: 22px; }
.step-up p { margin: 0 0 8px; }
.seg-roads button, .road-tabs button { display: grid; gap: 1px; justify-items: center; line-height: 1.15; }
.seg-roads button small, .road-tabs button small { font: 600 12px var(--body, inherit); opacity: 0.8; }
.road-tabs { margin: 10px 0 4px; flex-wrap: wrap; }
.camp-ready { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-weight: 700; }
.camp-ready .link { background: none; border: 0; padding: 0; font: inherit; color: var(--primary); text-decoration: underline; cursor: pointer; }
@media (max-width: 820px) {
  .roads { grid-template-columns: 1fr; }
  .road-card { min-height: 0; }
}
/* narrow screens: one column on the start screen */
@media (max-width: 860px) {
  .start-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .paths, .hero-fields { grid-template-columns: 1fr; }
  .hero-head { align-items: flex-start; }
  .hero-head .pip { width: 64px; height: 64px; }
}

/* ============ CALM PREVIEW: a quieter layout. Same rules, same bank, fewer things on screen at once. ============ */

.preview-tag { margin-left: 2px; padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: var(--sky-muted); font: 800 12px var(--display); white-space: nowrap; }

/* ---------- start screen: one main button ---------- */
.calm-main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
.calm-hero { display: flex; align-items: center; gap: 14px; color: var(--sky-ink); }
.calm-hero .pip { flex: none; }
.calm-hello h1 { font-size: clamp(30px, 5vw, 46px); color: #fff; line-height: 1.08; text-wrap: balance; }
.link-btn { background: none; border: 0; padding: 4px 2px; font: 700 15px var(--font); color: var(--sky-muted); text-decoration: underline; cursor: pointer; vertical-align: middle; letter-spacing: 0; }
.continue-btn {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 96px; padding: 18px 22px; border-radius: 22px; border: 0;
  background: var(--gold); color: var(--gold-ink); box-shadow: 0 6px 0 var(--gold-deep); font: inherit; text-align: left; cursor: pointer;
  touch-action: manipulation; transition: transform 0.08s;
}
.continue-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--gold-deep); }
.continue-btn svg { flex: none; }
.continue-btn .cb-text { flex: 1; display: grid; gap: 3px; }
.continue-btn b { font: 800 clamp(26px, 4vw, 32px)/1.1 var(--display); }
.continue-btn .cb-sum { font-size: 16.5px; font-weight: 700; color: #55400a; }
.train-btn { justify-self: center; min-width: 240px; }
.change { color: var(--sky-ink); }
.change-toggle {
  display: flex; align-items: center; gap: 8px; margin: 0 auto; min-height: 44px; padding: 4px 10px; background: none; border: 0;
  color: var(--sky-muted); font: 700 16px var(--font); text-decoration: underline; cursor: pointer;
}
.change-body { display: grid; gap: 12px; margin-top: 8px; padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.16); }
.change-body .field { margin: 0; color: var(--sky-ink); }
.change-body .roads { margin-top: 0; }
.change-body .road-card { min-height: 0; }
.progress-card .realm-path { margin-bottom: 10px; }
.progress-card .pc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.pc-relics { font-weight: 800; color: var(--ink-2); }
.welcome-card { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 28px 22px; }
.welcome-card h1 { font-size: clamp(30px, 5vw, 42px); }
.welcome-card p { font-size: 20px; margin: 0; }
.welcome-card .link-btn { color: var(--muted); }
.name-form { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.name-form input { flex: 1 1 220px; max-width: 360px; min-height: 56px; border: 2px solid var(--line-strong); border-radius: 14px; padding: 10px 14px; font-size: 20px; background: var(--card); }
.name-form.inline { justify-content: flex-start; align-items: center; }
.name-form.inline input { flex: 1 1 180px; max-width: 260px; min-height: 48px; font-size: 18px; }
.page-title { color: #fff; font-size: clamp(28px, 4.5vw, 40px); }

/* ---------- top bar during a quest: one row ---------- */
.calm-hud { flex-wrap: nowrap; }
.calm-hud .hud-cell { flex: none; }
.tally-wrap { position: relative; flex: none; }
.tally-chip {
  display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--card-2); color: var(--ink); font: 800 17px var(--font); font-variant-numeric: tabular-nums; cursor: pointer;
}
.tally-chip .tc-ok { color: var(--good); }
.tally-chip .tc-no { color: var(--retry); }
.tally-chip.on { border-color: var(--primary); }
.tally.tally-pop {
  position: absolute; top: calc(100% + 8px); right: 0; left: auto; z-index: 35; flex: none; width: max-content; max-width: min(330px, 86vw);
  padding: 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
}

/* ---------- problem: sketch pad closed with its tip, one help panel ---------- */
.pad.calm-pad { display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; margin: 6px 0 10px; }
.pad.calm-pad.has-tip { padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--card-2); }
.pad-tip-line { flex: 1; display: flex; align-items: flex-start; gap: 6px; font-size: 15.5px; font-weight: 700; line-height: 1.35; color: var(--ink-2); }
.pad-tip-line svg { flex: none; margin-top: 2px; }
.pad.calm-pad .btn { flex: none; }
.help-panel { display: grid; gap: 2px; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--line-strong); }
.pad-toggle { margin-top: 8px; padding: 4px 2px; background: none; border: 0; color: var(--primary); font: 700 15px var(--font); text-decoration: underline; cursor: pointer; }

/* ---------- Check: in the answer card on wide screens, docked to the bottom on a portrait iPad or a phone ---------- */
.dock-inline .gate { margin: 14px 0 0; }
.dock-inline .actions { margin-top: 8px; }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 10px clamp(10px, 3vw, 28px) max(10px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.97); border-top: 1px solid var(--line); box-shadow: 0 -12px 26px -18px rgba(8, 10, 30, 0.55);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: transform 0.18s ease-out;
}
.dock-inner { max-width: 1184px; margin: 0 auto; }
.dock .gate { margin: 0 0 6px; font-size: 14.5px; }
.dock .actions { margin-top: 0; flex-wrap: nowrap; }
.dock .actions .btn { min-height: 54px; }
.dock .actions .btn:first-child { flex: 0 1 auto; }
.dock .actions .btn.big:last-child { flex: 1 1 auto; }
.dock.away { transform: translateY(115%); pointer-events: none; }
body.docked .app { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
body.docked .toast { bottom: calc(142px + env(safe-area-inset-bottom)); }

/* ---------- end screen ---------- */
.calm-end { max-width: 820px; margin: 0 auto; }
.result-stats.three > div { flex: 1 1 0; justify-content: center; min-width: 96px; }
.end-place { margin: 0; font-weight: 700; }
.tip-card { margin: 0; font-size: 17px; }
.step-up.compact h2 { font-size: 20px; margin-bottom: 8px; }
.calm-end .end-actions .btn.big { flex: 1 1 200px; }
.grown-ups { padding: 4px 14px; border-radius: 18px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.16); color: var(--sky-ink); }
.grown-ups > summary { display: flex; align-items: center; min-height: 48px; cursor: pointer; font: 800 16px var(--display); color: var(--sky-muted); }
.grown-ups[open] { padding-bottom: 14px; }

/* ---------- parent corner: the countdowns live here now ---------- */
.parent-countdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }

/* ---------- narrow screens ---------- */
@media (max-width: 600px) {
  /* one slim row on a phone (it wraps the two buttons only on very narrow screens, never wider than the screen) */
  .calm-hud { position: sticky; top: 4px; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 14px; }
  .calm-hud .hud-cell { min-height: 38px; padding: 3px 6px; gap: 4px; border-radius: 10px; }
  .calm-hud .hud-cell b { font-size: 17px; }
  .calm-hud .hud-cell.level span { font-size: 13px; }
  .calm-hud .hud-word, .calm-hud .pips, .calm-hud .timer svg { display: none; }
  .calm-hud .tally-chip { min-height: 38px; padding: 3px 6px; gap: 5px; font-size: 14px; border-radius: 10px; }
  .calm-hud .icon-btn { width: 36px; height: 36px; border-radius: 10px; }
  .calm-hud .hud-actions { gap: 4px; }
  .calm-hero .pip { width: 64px; height: 64px; }
  .continue-btn { padding: 16px 16px; gap: 10px; }
  .pad.calm-pad.has-tip { flex-wrap: wrap; }
}

/* ---------- Contest Day (src/contest.jsx). Every class starts with ct-. ---------- */
.ct-root { max-width: 860px; margin: 0 auto; }
.ct-page { display: grid; gap: 14px; }
.ct-top { display: flex; align-items: center; gap: 12px; justify-content: space-between; min-height: 52px; }
.ct-title { font-family: var(--display); font-size: clamp(24px, 3.2vw, 32px); margin: 0; flex: 1; text-align: center; color: var(--ink); }
.ct-lead { margin: 0; text-align: center; font-size: 19px; color: var(--ink); font-weight: 700; }

/* format picker */
.ct-formats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ct-format {
  appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; display: grid; gap: 8px; align-content: start;
  min-height: 150px; border: 2px solid var(--line-strong); position: relative; touch-action: manipulation; transition: transform 0.08s, border-color 0.15s;
}
.ct-format:hover { border-color: var(--primary); }
.ct-format:active { transform: translateY(2px); }
.ct-format.ct-suggested { border-color: var(--primary); box-shadow: var(--shadow), 0 0 0 4px var(--primary-soft); }
.ct-format-name { font-family: var(--display); font-size: 24px; font-weight: 800; padding-right: 86px; }
.ct-format-line { font-size: 17px; color: var(--muted); font-weight: 700; }
.ct-badge { position: absolute; top: 14px; right: 14px; background: var(--primary); color: var(--primary-ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 800; }

/* pep talk */
.ct-pep-card { display: grid; justify-items: center; text-align: center; gap: 10px; padding: clamp(22px, 4vw, 40px); }
.ct-mentor {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 36px; font-weight: 800;
  background: var(--primary-soft); color: var(--primary); border: 3px solid var(--primary);
}
.ct-pep-text { font-size: clamp(20px, 2.6vw, 24px); line-height: 1.45; margin: 4px 0 6px; max-width: 34em; color: var(--ink); }
.ct-about { width: 100%; max-width: 34em; text-align: left; }
.ct-about summary { cursor: pointer; color: var(--primary); font-weight: 800; text-align: center; padding: 10px; min-height: 44px; list-style-position: inside; }
.ct-about ul { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 6px; color: var(--muted); font-size: 16px; }
.ct-main { min-width: 240px; }

/* round */
.ct-bar {
  position: sticky; top: max(6px, env(safe-area-inset-top)); z-index: 30; display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px; box-shadow: var(--shadow);
}
.ct-clock { display: flex; align-items: center; gap: 6px; padding: 4px 12px; min-height: 46px; border-radius: 12px; background: var(--card-2); font-variant-numeric: tabular-nums; color: var(--ink); }
.ct-clock b { font-size: 22px; }
.ct-clock.low { background: var(--gold); color: var(--gold-ink); }
.ct-count { font-weight: 800; font-size: 18px; white-space: nowrap; color: var(--ink); }
.ct-qbtn { gap: 6px; }
.ct-bar-actions { margin-left: auto; display: flex; gap: 8px; }
.ct-qcard { display: grid; gap: 12px; }
.ct-qmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ct-points { background: var(--primary-soft); color: var(--primary-deep); border-color: transparent; }
.ct-flag {
  margin-left: auto; appearance: none; font: inherit; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--card); color: var(--muted);
}
.ct-flag.on { border-color: var(--gold-deep); background: var(--gold); color: var(--gold-ink); }
.ct-q { font-size: clamp(19px, 2.2vw, 22px); line-height: 1.5; margin: 0; white-space: pre-line; color: var(--ink); }
.ct-fig { max-width: 360px; }
.ct-clear { appearance: none; background: none; border: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; justify-self: start; min-height: 40px; padding: 4px 2px; }
.ct-dock { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.ct-nav { justify-content: space-between; }
.ct-nav .ct-back { min-width: 120px; }
.ct-nav .ct-main { flex: 0 1 280px; }

/* question grid + dialogs */
.ct-grid-card { max-width: 520px; justify-items: stretch; text-align: left; }
.ct-grid-head { display: flex; align-items: center; justify-content: space-between; }
.ct-grid-head h2 { margin: 0; }
.ct-grid-label { font-weight: 800; color: var(--muted); font-size: 14px; }
.ct-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.ct-grid-sec + .ct-grid-sec { margin-top: 8px; }
.ct-cell {
  appearance: none; font: inherit; font-weight: 900; font-size: 18px; min-height: 52px; border-radius: 12px; cursor: pointer; position: relative;
  border: 2px solid var(--line-strong); background: var(--card); color: var(--ink); font-variant-numeric: tabular-nums;
}
.ct-cell.answered { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
.ct-cell.current { outline: 3px solid var(--ink); outline-offset: 1px; }
.ct-cell-flag { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 3px; background: var(--gold-deep); }
.ct-legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
.ct-key { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--line-strong); background: var(--card); margin-left: 6px; }
.ct-key.answered { background: var(--primary-soft); border-color: var(--primary); }
.ct-key.flagged { background: var(--gold-deep); border-color: var(--gold-deep); }
.ct-key.right { background: var(--good); border-color: var(--good); }
.ct-key.wrong { background: var(--retry); border-color: var(--retry); }
.ct-key.blank { background: var(--line-strong); }
.ct-finish-btn { width: 100%; }
.ct-confirm p { font-size: 18px; margin: 0; }

/* results */
.ct-res-card { display: grid; justify-items: center; text-align: center; gap: 10px; }
.ct-score { display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.ct-score b { font-family: var(--display); font-size: clamp(56px, 9vw, 80px); line-height: 1; color: var(--primary); }
.ct-score span { font-size: 22px; font-weight: 800; color: var(--muted); }
.ct-cheer { font-size: 19px; margin: 0; max-width: 32em; color: var(--ink); }
.ct-tally { margin: 0; }
.ct-sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px; }
.ct-sec { background: var(--card-2); border-radius: 14px; padding: 10px; display: grid; gap: 2px; }
.ct-sec-name { font-weight: 800; color: var(--muted); font-size: 14px; }
.ct-sec b { font-size: 24px; color: var(--ink); }
.ct-chart { width: 100%; margin: 4px 0 0; }
.ct-chart svg { width: 100%; height: auto; max-height: 200px; display: block; }
.ct-bar-right { fill: var(--good); }
.ct-bar-wrong { fill: var(--retry); }
.ct-bar-blank { fill: var(--line-strong); }
.ct-sep { stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ct-axis { fill: var(--muted); font-size: 11px; font-weight: 700; }
.ct-chart .ct-legend { justify-content: center; }
.ct-res-actions { flex-direction: column; align-items: center; }

/* review */
.ct-step-label { margin: 4px 0 0; font-weight: 800; color: var(--ink); }
.ct-shown .choice { cursor: default; }
.ct-shown .choice.ct-right { border-color: var(--good); background: var(--good-soft); }
.ct-shown .choice.ct-right .letter { background: var(--good); color: #fff; }
.ct-shown .choice.ct-right svg { margin-left: auto; color: var(--good); }
.ct-shown .choice.ct-miss { border-color: var(--retry); border-style: dashed; }
.ct-verdict { font-size: 20px; font-weight: 800; padding: 12px 14px; border-radius: 14px; }
.ct-verdict.good { background: var(--good-soft); color: var(--good); }
.ct-verdict.soft { background: var(--card-2); color: var(--ink); }
.ct-note { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--retry-soft); color: var(--ink); font-size: 17px; }
.ct-solution { background: var(--card-2); border-radius: 14px; padding: 12px 16px; color: var(--ink); }
.ct-solution ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 17px; line-height: 1.45; }

/* parent report */
.ct-report .ct-r-items .ri-head { align-items: center; }

/* phone: one-hand layout, the main button pinned to the bottom */
@media (max-width: 700px) {
  .ct-formats { grid-template-columns: minmax(0, 1fr); }
  .ct-format { min-height: 118px; }
  .ct-hide-narrow { display: none; }
  .ct-bar { gap: 6px; padding: 6px; }
  .ct-clock { padding: 4px 8px; }
  .ct-clock b { font-size: 20px; }
  .ct-count { font-size: 16px; }
  .ct-qbtn { padding: 6px 12px; min-height: 46px; }
  .ct-bar-actions .icon-btn { width: 46px; height: 46px; }
  .ct-page { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .ct-dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;
    padding: 10px 12px max(10px, env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -12px 26px -18px rgba(8, 10, 30, 0.55);
  }
  .ct-dock .ct-main { flex: 1 1 auto; min-width: 0; }
  .ct-nav .ct-back { min-width: 96px; }
  .ct-res-actions { flex-direction: row-reverse; }
  .ct-res-actions .btn.ghost { flex: 0 0 auto; }
  .ct-sections { gap: 6px; }
  .ct-sec b { font-size: 20px; }
  .ct-grid-card { padding: 18px 14px; }
}

/* text that sits on the page background (the sky), not on a card */
.ct-title, .ct-lead, .ct-top .ct-count, .ct-top .ct-count .muted { color: var(--sky-ink); }
.ct-top .btn.ghost { color: var(--sky-ink); border-color: var(--sky-muted); }
/* review: the Check button uses the app's ActionDock (it steps aside while the typing keyboard is up) */
.dock .ct-check-row { display: flex; }
.dock .ct-check-row .ct-main { flex: 1 1 auto; min-width: 0; }
.dock-inline .ct-check-row { display: flex; justify-content: center; margin-top: 6px; }

/* ---------- Contest Day v2: sprint label, pacing tips, results lines, the race ---------- */
.ct-round-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ct-toast {
  display: flex; align-items: center; gap: 10px; margin: 8px 0 0; padding: 6px 6px 6px 14px;
  background: var(--card, #fff); color: var(--ink); border: 2px solid var(--line-strong, #ccd); border-radius: 14px;
  font-size: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.ct-toast-text { flex: 1; }
.ct-toast-x {
  flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  font-size: 26px; line-height: 1; cursor: pointer;
}
.ct-toast-x:hover, .ct-toast-x:focus-visible { background: var(--line, rgba(0, 0, 0, 0.06)); color: var(--ink); }
.ct-best, .ct-honor, .ct-blanks { margin: 0; font-size: 17px; color: var(--ink); max-width: 36em; }
.ct-best.up, .ct-honor.reached { font-weight: 800; }
.ct-honor::before { content: '★ '; color: var(--primary); }
.ct-blanks { color: var(--muted); font-size: 16px; }
.ct-score-max { margin-left: -6px; }
.ct-score .ct-score-unit { font-size: 18px; }
.ct-locked { font-weight: 800; color: var(--primary); font-size: 17px; }
.ct-race .choice:disabled { opacity: 1; }
.ct-race .choice:disabled:not(.picked) { opacity: 0.55; }
.ct-rupees { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--good, var(--primary)); }
.ct-race-results .ct-res-card { align-items: center; text-align: center; }
@media (max-width: 700px) {
  .ct-round-name { display: none; }
  .ct-toast { font-size: 15px; }
}
/* the round's main buttons stay on screen under a tall picture (desktop; phones already pin the dock) */
/* (width 100% with max-height: a picture drawn with only a viewBox would otherwise collapse to nothing) */
.ct-fig svg { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; }
.ct-round .ct-fig svg { max-height: 34vh; }
@media (min-width: 701px) {
  .ct-round .ct-nav { position: sticky; bottom: 0; z-index: 5; background: var(--card); padding: 10px 0; margin-bottom: -10px; }
}

/* ============ v3 additions shared by both skins ============ */
.path-line { display: flex; align-items: center; gap: 12px; margin: 4px 0 2px; padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); color: var(--sky-ink); }
.path-line b { display: block; font-family: var(--display); font-size: 17px; line-height: 1.25; color: var(--sky-ink); }
.path-line .muted { color: var(--sky-muted); }
.path-ring { flex: none; }
.path-ring .pr-track { fill: none; stroke: rgba(255, 255, 255, 0.22); stroke-width: 5; }
.path-ring .pr-fill { fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round; }
.side-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.side-btns .btn { position: relative; }
.btn .dot, .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-left: 6px; vertical-align: middle; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25); }
.contest-tip { text-align: center; color: var(--sky-muted); margin: -2px 0 0; }
.busy-card { text-align: center; display: grid; gap: 10px; justify-items: center; }
.end-active { display: block; margin: 2px auto 0; color: var(--sky-muted); text-align: center; }
.end-active .link-btn { color: var(--gold); }
.answer-read { margin: 6px 2px 0; font-size: 15px; color: var(--muted); }
.answer-read.tip { color: var(--retry); font-weight: 700; }
.error { color: var(--retry); font-weight: 700; }

/* first-run setup */
.setup .setup-card { max-width: 520px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.setup .setup-card [role='form'] { display: grid; gap: 12px; width: 100%; }
.setup .field { display: grid; gap: 4px; text-align: left; width: 100%; }
.setup .field input { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink); min-height: 48px; }
.setup-roads, .setup-levels { display: grid; gap: 8px; width: 100%; }
.setup-levels { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.setup-road, .setup-level { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; min-height: 48px; }
.setup-road.on, .setup-level.on { border-color: var(--primary); background: var(--primary-soft); }
.setup-steps { margin: 0; }

/* the ocarina toy */
.ocarina { display: grid; gap: 12px; justify-items: center; text-align: center; }
.ocarina-keys { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ocarina-key { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--gold-deep); background: radial-gradient(circle at 40% 35%, #fff7dc, var(--gold) 70%); color: var(--gold-ink); font: 800 18px var(--display); cursor: pointer; touch-action: manipulation; }
.ocarina-key:active, .ocarina-key.on { transform: translateY(2px); background: radial-gradient(circle at 40% 35%, #fff, #f3d27a 70%); }
.ocarina-song { min-height: 28px; font-weight: 700; color: var(--ink-2); }

/* ============ the Hyrule skin ============ */
html[data-skin='hyrule'] {
  --sky-1: #0f2417;
  --sky-2: #1c3d26;
  --sky-3: #2c5631;
  --sky-ink: #f6eed7;
  --sky-muted: #cfdcbd;
  --bg: #f3ead2;
  --hud-bg: rgba(251, 245, 228, 0.96);
  --card: #fbf5e4;
  --card-2: #f1e5c6;
  --ink: #2b2115;
  --ink-2: #4d3c24;
  --muted: #6c5a3d;
  --line: #e4d4ae;
  --line-strong: #c7ad78;
  --primary: #2f7a45;
  --primary-deep: #1d5530;
  --primary-ink: #ffffff;
  --primary-soft: #e2efd6;
  --gold: #e1b64c;
  --gold-deep: #94701f;
  --gold-ink: #2b1d00;
  --boss: #8e2b2b;
  --boss-deep: #5f1717;
  --boss-soft: #f7e2da;
  --shadow: 0 1px 0 rgba(30, 20, 5, 0.12), 0 16px 36px -18px rgba(10, 18, 8, 0.7);
  --display: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  background: var(--sky-1);
}
html[data-skin='hyrule'] body::before {
  background-image:
    var(--scene, none),
    radial-gradient(1200px 700px at 70% -12%, rgba(255, 236, 170, 0.28), transparent 62%),
    radial-gradient(900px 600px at 10% 110%, rgba(8, 20, 10, 0.75), transparent 70%),
    repeating-linear-gradient(100deg, rgba(255, 245, 200, 0.05) 0 40px, transparent 40px 140px),
    linear-gradient(180deg, #24492c 0%, #183622 45%, #0d2014 100%);
  background-size: cover, auto, auto, auto, auto;
